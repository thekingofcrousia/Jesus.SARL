<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesus</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    margin: 0;
    padding: 4rem 1.5rem;
    line-height: 1.6;
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.2rem; }
  .status { color: #888; font-size: 0.9rem; margin: 0 0 3rem; }
  textarea {
    width: 100%;
    min-height: 120px;
    font-family: inherit;
    font-size: 1.1rem;
    padding: 0;
    border: none;
    border-bottom: 1px solid #ccc;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: #111;
    color: #fff;
    cursor: pointer;
    margin-top: 1rem;
  }
  #chat { margin-top: 4rem; }
  .msg { margin: 1.2rem 0; }
  .msg small { color: #888; display: block; }
  footer { margin-top: 4rem; color: #aaa; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Jesus</h1>
  <p class="status" id="statusNote">Line waiting.</p>

  <form id="chatForm">
    <textarea id="chatInput" placeholder="Say something."></textarea>
    <button type="submit">Send</button>
  </form>

  <div id="chat"></div>

  <footer>Public history. Everyone can see what is written here.</footer>
</main>
<script>
  var BACKEND_URL = "/api";

  function checkStatus() {
    var note = document.getElementById("statusNote");
    var controller = new AbortController();
    setTimeout(function () { controller.abort(); }, 2000);
    fetch(BACKEND_URL + "/status", { signal: controller.signal })
      .then(function (r) { return r.json(); })
      .then(function (data) { note.textContent = (data && data.status === "in") ? "Line open." : "Line waiting."; })
      .catch(function () { note.textContent = "Line waiting."; });
  }

  function renderChat(messages) {
    var chat = document.getElementById("chat");
    chat.innerHTML = "";
    messages.forEach(function (m) {
      var div = document.createElement("div");
      div.className = "msg";
      var meta = document.createElement("small");
      meta.textContent = m.author || "Visitor";
      var body = document.createElement("div");
      body.textContent = m.text;
      div.appendChild(meta);
      div.appendChild(body);
      chat.appendChild(div);
    });
  }

  function loadChat() {
    return fetch(BACKEND_URL + "/history")
      .then(function (r) { return r.json(); })
      .then(function (data) { renderChat(data.messages || []); })
      .catch(function () {});
  }

  document.getElementById("chatForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if (!text) return;
    fetch(BACKEND_URL + "/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author: "Visitor", text: text })
    })
      .then(function () { input.value = ""; return loadChat(); })
      .catch(function () { loadChat(); });
  });

  checkStatus();
  loadChat();
</script>
</body>
</html>

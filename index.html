<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesus</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    margin: 0;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    width: 100%;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1rem 1.5rem 0.75rem;
    border-bottom: 1px solid #eee;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
  .status { color: #888; font-size: 0.85rem; margin: 0.15rem 0 0; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg {
    max-width: 80%;
    padding: 0.7rem 1rem;
    border-radius: 18px;
  }
  .msg small { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.15rem; }
  .msg.jesus { align-self: flex-start; background: #f0f0f0; }
  .msg.visitor { align-self: flex-end; background: #111; color: #fff; }
  form {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
    padding: 1rem 1.5rem;
    border-top: 1px solid #eee;
  }
  textarea {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    padding: 0.7rem 1rem;
    border: 1px solid #ddd;
    border-radius: 999px;
    resize: none;
    outline: none;
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    border: none;
    background: #111;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Jesus</h1>
    <p class="status"><span id="statusNote">Line waiting.</span> Public history — everyone can see what is written here.</p>
  </header>

  <div id="chat"></div>

  <form id="chatForm">
    <textarea id="chatInput" rows="1" placeholder="Say something."></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<script>
  var BACKEND_URL = "/api";
  var firstLoad = true;

  function checkStatus() {
    var note = document.getElementById("statusNote");
    var controller = new AbortController();
    setTimeout(function () { controller.abort(); }, 2000);
    fetch(BACKEND_URL + "/status", { signal: controller.signal })
      .then(function (r) { return r.json(); })
      .then(function (data) { note.textContent = (data && data.status === "in") ? "Line open." : "Line waiting."; })
      .catch(function () { note.textContent = "Line waiting."; });
  }

  function renderChat(messages) {
    var chat = document.getElementById("chat");
    var nearBottom = firstLoad || (chat.scrollHeight - chat.scrollTop - chat.clientHeight < 200);
    chat.innerHTML = "";
    messages.forEach(function (m) {
      var div = document.createElement("div");
      div.className = "msg " + (m.author === "Jesus" ? "jesus" : "visitor");
      var meta = document.createElement("small");
      meta.textContent = m.author || "Visitor";
      var body = document.createElement("div");
      body.textContent = m.text;
      div.appendChild(meta);
      div.appendChild(body);
      chat.appendChild(div);
    });
    if (nearBottom) { chat.scrollTop = chat.scrollHeight; }
    firstLoad = false;
  }

  function loadChat() {
    return fetch(BACKEND_URL + "/history")
      .then(function (r) { return r.json(); })
      .then(function (data) { renderChat(data.messages || []); })
      .catch(function () {});
  }

  function sendMessage() {
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if (!text) return;
    fetch(BACKEND_URL + "/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ author: "Visitor", text: text })
    })
      .then(function () { input.value = ""; return loadChat(); })
      .catch(function () { loadChat(); });
  }

  document.getElementById("chatForm").addEventListener("submit", function (e) {
    e.preventDefault();
    sendMessage();
  });

  document.getElementById("chatInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  checkStatus();
  loadChat();
  // Poll for updates every 10 seconds, matching the Air backend's poll,
  // so new Jesus replies appear without reloading the page.
  setInterval(function () { checkStatus(); loadChat(); }, 10000);
</script>
</body>
</html>
